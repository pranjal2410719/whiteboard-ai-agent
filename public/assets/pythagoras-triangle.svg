<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Right-angled triangle for Pythagoras Theorem -->
  <polygon points="50,250 350,250 50,50" fill="#e9f4e8" stroke="#3b805c" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right-angle indicator -->
  <rect x="50" y="225" width="25" height="25" fill="none" stroke="#3b805c" stroke-width="2.5"/>
  <text x="62" y="242" font-family="system-ui, sans-serif" font-size="12" fill="#3b805c" font-weight="600">90°</text>
  <!-- Labels -->
  <text x="30" y="155" font-family="system-ui, sans-serif" font-size="20" fill="#8868a0" font-weight="bold" text-anchor="end">a = 6</text>
  <text x="200" y="280" font-family="system-ui, sans-serif" font-size="20" fill="#507aaf" font-weight="bold" text-anchor="middle">b = 8</text>
  <text x="220" y="135" font-family="system-ui, sans-serif" font-size="22" fill="#ad6a3a" font-weight="bold">c = 10 (hypotenuse)</text>
</svg>
